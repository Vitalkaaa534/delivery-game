<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Delivery Simulator - 3D Drive</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(22, 31, 48, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* TOP HUD */
    .hud-top {
      position: absolute;
      top: calc(env(safe-area-inset-top, 10px) + 4px);
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .courier-info {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .stats-group {
      display: flex;
      gap: 6px;
    }

    .stat-badge {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* MISSION CARD */
    .mission-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-yellow);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.3s;
    }

    .mission-card.delivering {
      border-left-color: var(--accent-green);
    }

    .mission-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }

    .mission-desc {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .mission-reward {
      text-align: right;
      font-weight: 800;
      color: var(--accent-green);
      font-size: 14px;
    }

    /* CONTROLS OVERLAY */
    .controls-layer {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 15px) + 12px);
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .steering-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .btn-ctrl {
      width: 64px;
      height: 64px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 2px solid var(--card-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: transform 0.08s, background 0.08s;
      cursor: pointer;
    }

    .btn-ctrl:active, .btn-ctrl.pressed {
      transform: scale(0.90);
      background: rgba(59, 130, 246, 0.4);
      border-color: var(--accent-blue);
    }

    .btn-gas-single {
      pointer-events: auto;
      width: 82px;
      height: 82px;
      background: rgba(16, 185, 129, 0.25);
      border: 2.5px solid var(--accent-green);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
      cursor: pointer;
      transition: transform 0.08s, background 0.08s;
    }

    .btn-gas-single:active, .btn-gas-single.pressed {
      transform: scale(0.92);
      background: rgba(16, 185, 129, 0.65);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.6);
    }

    /* TOAST */
    .toast {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-green);
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 15px;
      color: var(--accent-green);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 30;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

  <div class="game-container" id="app">
    <!-- TOP HUD -->
    <div class="hud-top">
      <div class="status-bar">
        <div class="courier-info">
          <span>🛵</span>
          <span>Кур'єр #1</span>
        </div>
        <div class="stats-group">
          <div class="stat-badge" style="color: var(--accent-green);">
            💵 <span id="moneyText">0 ₴</span>
          </div>
          <div class="stat-badge" style="color: var(--accent-yellow);">
            ⭐ <span id="ratingText">5.0</span>
          </div>
        </div>
      </div>

      <!-- MISSION CARD -->
      <div class="mission-card" id="missionCard">
        <div>
          <div class="mission-title" id="mStatus">Крок 1: Забери замовлення</div>
          <div class="mission-desc" id="mTarget">Кав'ярня "Lviv Coffee"</div>
        </div>
        <div class="mission-reward">
          <div id="mReward">+180 ₴</div>
          <div style="font-size:10px; color:#94a3b8;" id="mDist">0 м</div>
        </div>
      </div>
    </div>

    <!-- CANVAS ENGINE -->
    <canvas id="gameCanvas"></canvas>

    <!-- TOAST -->
    <div class="toast" id="toast">Замовлення забрано! 📦</div>

    <!-- CONTROLS LAYER -->
    <div class="controls-layer">
      <!-- ЛІВОРУЧ: КЕРУВАННЯ СТРІЛКАМИ -->
      <div class="steering-group">
        <div class="btn-ctrl" id="btnLeft">⬅️</div>
        <div class="btn-ctrl" id="btnRight">➡️</div>
      </div>

      <!-- ПРАВОРУЧ: ЄДИНА КНОПКА ГАЗУ -->
      <div class="btn-gas-single" id="btnGas">
        <span style="font-size: 26px; line-height: 1;">⚡</span>
        <span style="font-size: 10px; font-weight: 900; margin-top:2px;">ГАЗ</span>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = document.getElementById('app').clientWidth;
      canvas.height = document.getElementById('app').clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ==========================================
    // СТАН ГРИ
    // ==========================================
    let money = 0;

    // Фізика скутера
    const player = {
      x: 0,          // Бокова позиція на дорозі (-180 до 180)
      speed: 0,      // Поточна швидкість
      maxSpeed: 8.5, // Максимальна швидкість
      accel: 0.12,   // Розгін при затисканні газу
      autoBrake: 0.22, // Автоматичне гальмування при відпусканні
      turnSpeed: 3.2
    };

    let roadScroll = 0;
    const inputState = { left: false, right: false, gas: false };

    // Система міських об'єктів (3D Perspective)
    let buildings = [];
    for (let i = 0; i < 24; i++) {
      buildings.push({
        z: i * 50,
        side: i % 2 === 0 ? -1 : 1,
        width: 100 + Math.random() * 40,
        height: 90 + Math.random() * 80,
        color: ['#1e293b', '#334155', '#0f172a', '#1e1b4b'][Math.floor(Math.random() * 4)]
      });
    }

    // Замовлення
    const deliveryState = {
      phase: 'PICKUP',
      targetZ: 600,
      reward: 180,
      targetName: 'Кав\'ярня "Lviv Coffee"'
    };

    function spawnNextOrder() {
      deliveryState.targetZ = roadScroll + 700 + Math.random() * 500;
      deliveryState.reward = Math.floor(140 + Math.random() * 120);
      deliveryState.phase = 'PICKUP';
      deliveryState.targetName = ['Суші Бар "Oishi"', 'Бургерна "Craft"', 'Кав\'ярня "Lviv Coffee"', 'Піцерія "Puzata Hata"'][Math.floor(Math.random() * 4)];
      updateMissionUI();
    }

    function updateMissionUI() {
      const card = document.getElementById('missionCard');
      const mStatus = document.getElementById('mStatus');
      const mTarget = document.getElementById('mTarget');
      const mReward = document.getElementById('mReward');

      if (deliveryState.phase === 'PICKUP') {
        card.classList.remove('delivering');
        mStatus.innerText = 'Крок 1: Забери замовлення';
        mTarget.innerText = deliveryState.targetName;
      } else {
        card.classList.add('delivering');
        mStatus.innerText = 'Крок 2: Доставити клієнту';
        mTarget.innerText = 'вул. Свободи, ' + Math.floor(Math.random() * 50 + 1);
      }
      mReward.innerText = `+${deliveryState.reward} ₴`;
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ==========================================
    // НАДІЙНІ СЕНСОРНІ ПОДІЇ (POINTER EVENTS FIX)
    // ==========================================
    function setupPointerControl(id, keyName) {
      const btn = document.getElementById(id);

      const handleDown = (e) => {
        e.preventDefault();
        try { btn.setPointerCapture(e.pointerId); } catch(err){}
        inputState[keyName] = true;
        btn.classList.add('pressed');
      };

      const handleUp = (e) => {
        e.preventDefault();
        inputState[keyName] = false;
        btn.classList.remove('pressed');
      };

      btn.addEventListener('pointerdown', handleDown);
      btn.addEventListener('pointerup', handleUp);
      btn.addEventListener('pointercancel', handleUp);
      btn.addEventListener('pointerleave', handleUp);
    }

    setupPointerControl('btnLeft', 'left');
    setupPointerControl('btnRight', 'right');
    setupPointerControl('btnGas', 'gas');

    // Клавіатура для тесту з ПК (Стрілки або A/D/Space)
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') inputState.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') inputState.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') inputState.gas = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') inputState.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') inputState.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') inputState.gas = false;
    });

    // ==========================================
    // 3D ПРОЄКЦІЯ ТА КАМЕРА
    // ==========================================
    const FOV = 170;
    const Z_FAR = 650;

    function project(x, z) {
      let scale = FOV / (z + FOV);
      let horizonY = canvas.height * 0.38;
      let bottomY = canvas.height - 50;

      return {
        x: canvas.width / 2 + (x - player.x) * scale,
        y: horizonY + (bottomY - horizonY) * scale,
        scale: scale
      };
    }

    // ==========================================
    // ФІЗИКА ТА ОНОВЛЕННЯ
    // ==========================================
    function update() {
      // 1. Логіка Газу та Автогальмування
      if (inputState.gas) {
        player.speed = Math.min(player.speed + player.accel, player.maxSpeed);
      } else {
        // Автоматично гальмує, коли відпустив кнопку
        player.speed = Math.max(player.speed - player.autoBrake, 0);
      }

      // 2. Повороти керма
      if (inputState.left) {
        player.x = Math.max(-170, player.x - player.turnSpeed * (player.speed > 0 ? 1 : 0.4));
      }
      if (inputState.right) {
        player.x = Math.min(170, player.x + player.turnSpeed * (player.speed > 0 ? 1 : 0.4));
      }

      // 3. Просуванння вперед
      roadScroll += player.speed;

      // 4. Оновлення нескінченних будинків
      buildings.forEach(b => {
        if (b.z < roadScroll - 50) {
          b.z += Z_FAR;
        }
      });

      // 5. Дистанція та виконання замовлення
      let distRemaining = Math.max(0, Math.round(deliveryState.targetZ - roadScroll));
      document.getElementById('mDist').innerText = `${distRemaining} м`;

      if (distRemaining <= 15) {
        if (deliveryState.phase === 'PICKUP') {
          deliveryState.phase = 'DELIVER';
          deliveryState.targetZ = roadScroll + 800 + Math.random() * 400;
          showToast('Замовлення забрано! 📦 Їдь до клієнта');
          updateMissionUI();
        } else {
          money += deliveryState.reward;
          document.getElementById('moneyText').innerText = `${money} ₴`;
          showToast(`Доставку виконано! +${deliveryState.reward} ₴ 🎉`);
          spawnNextOrder();
        }
      }
    }

    // ==========================================
    // РЕНДЕР (ВИД ЗЗАДУ)
    // ==========================================
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let horizonY = canvas.height * 0.38;

      // 1. Небо та градієнт фону
      let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, '#020617');
      skyGrad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, horizonY);

      // 2. Земля (Газони з боків)
      ctx.fillStyle = '#065f46';
      ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

      // 3. 3D Дорога та розмітка
      const ROAD_W = 220;
      const SEGMENTS = 32;
      const segZ = Z_FAR / SEGMENTS;

      for (let i = SEGMENTS - 1; i >= 0; i--) {
        let z1 = i * segZ;
        let z2 = (i + 1) * segZ;

        let p1 = project(0, z1);
        let p2 = project(0, z2);

        let w1 = ROAD_W * p1.scale;
        let w2 = ROAD_W * p2.scale;

        // Обочина
        let sw1 = (ROAD_W + 36) * p1.scale;
        let sw2 = (ROAD_W + 36) * p2.scale;
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.moveTo(p1.x - sw1, p1.y); ctx.lineTo(p1.x + sw1, p1.y);
        ctx.lineTo(p2.x + sw2, p2.y); ctx.lineTo(p2.x - sw2, p2.y);
        ctx.fill();

        // Асфальт
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(p1.x - w1, p1.y); ctx.lineTo(p1.x + w1, p1.y);
        ctx.lineTo(p2.x + w2, p2.y); ctx.lineTo(p2.x - w2, p2.y);
        ctx.fill();

        // Переривчаста смуга по центру
        let realZ = z1 + (roadScroll % 40);
        if (Math.floor(realZ / 30) % 2 === 0) {
          let dash1 = 5 * p1.scale;
          let dash2 = 5 * p2.scale;
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.moveTo(p1.x - dash1, p1.y); ctx.lineTo(p1.x + dash1, p1.y);
          ctx.lineTo(p2.x + dash2, p2.y); ctx.lineTo(p2.x - dash2, p2.y);
          ctx.fill();
        }
      }

      // 4. 3D Будинки обабіч дороги
      let sortedBuildings = [...buildings].sort((a, b) => b.z - a.z);
      sortedBuildings.forEach(b => {
        let relZ = b.z - (roadScroll % Z_FAR);
        if (relZ < 5) relZ += Z_FAR;

        let roadOffset = b.side * 165;
        let p = project(roadOffset, relZ);

        let bw = b.width * p.scale;
        let bh = b.height * p.scale;

        ctx.fillStyle = b.color;
        ctx.fillRect(p.x - bw / 2, p.y - bh, bw, bh);

        // Вікна будинків
        ctx.fillStyle = '#fef08a';
        for (let wx = -bw/3; wx <= bw/3; wx += 14 * p.scale) {
          for (let wy = -bh + 12 * p.scale; wy < -12 * p.scale; wy += 20 * p.scale) {
            ctx.fillRect(p.x + wx, p.y + wy, 6 * p.scale, 9 * p.scale);
          }
        }
      });

      // 5. Маркер точки призначення (Арка / Зона замовлення)
      let targetRelZ = deliveryState.targetZ - roadScroll;
      if (targetRelZ > 0 && targetRelZ < Z_FAR) {
        let tp = project(0, targetRelZ);
        let size = 40 * tp.scale;

        let color = deliveryState.phase === 'PICKUP' ? '#f59e0b' : '#10b981';
        ctx.strokeStyle = color;
        ctx.fillStyle = color + '44';
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.ellipse(tp.x, tp.y, size * 2.5, size * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.font = `bold ${Math.max(12, Math.floor(22 * tp.scale))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(deliveryState.phase === 'PICKUP' ? '📦 ЗАМОВЛЕННЯ' : '🏁 КЛІЄНТ', tp.x, tp.y - size * 1.5);
      }

      // 6. КУР'ЄР (ВИД ЗЗАДУ / 3RD PERSON MODEL)
      let cx = canvas.width / 2;
      let cy = canvas.height - 75;

      ctx.save();
      ctx.translate(cx, cy);

      // Нахил тулуба при поворотах
      let tilt = 0;
      if (inputState.left) tilt = -0.12;
      if (inputState.right) tilt = 0.12;
      ctx.rotate(tilt);

      // Тінь скутера
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 32, 28, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Заднє колесо
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-6, 12, 12, 22);

      // Корпус скутера (Задня частина)
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.roundRect(-22, -10, 44, 30, 8);
      ctx.fill();

      // Заднє стоп-світло (палає яскравіше при автогальмуванні)
      let isBraking = !inputState.gas && player.speed > 0;
      ctx.fillStyle = isBraking ? '#ff0000' : '#991b1b';
      ctx.shadowColor = isBraking ? '#ff0000' : 'transparent';
      ctx.shadowBlur = isBraking ? 15 : 0;
      ctx.fillRect(-12, 12, 24, 6);
      ctx.shadowBlur = 0;

      // Спина кур'єра (Плечі / Куртка)
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(-20, -42, 40, 26, 6);
      ctx.fill();

      // ТЕРМОСУМКА ДОСТАВКИ (НА СПИНІ КУР'ЄРА)
      ctx.fillStyle = '#10b981'; // Яскраво-зелена сумка
      ctx.beginPath();
      ctx.roundRect(-16, -46, 32, 28, 4);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('📦', 0, -28);

      // Шолом (Вид ззаду)
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, -52, 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ==========================================
    // ГОЛОВНИЙ ЦИКЛ ГРИ
    // ==========================================
    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    spawnNextOrder();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
