<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Courier Delivery Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background: #1e293b;
      overflow: hidden;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* TOP HUD */
    .hud-top {
      position: absolute;
      top: calc(env(safe-area-inset-top, 10px) + 5px);
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .courier-info {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .stats-group {
      display: flex;
      gap: 6px;
    }

    .stat-badge {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* MISSION PANEL */
    .mission-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-yellow);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.3s;
    }

    .mission-card.delivering {
      border-left-color: var(--accent-green);
    }

    .mission-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }

    .mission-desc {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .mission-reward {
      text-align: right;
      font-weight: 800;
      color: var(--accent-green);
      font-size: 14px;
    }

    /* CONTROLS OVERLAY */
    .controls-layer {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 15px) + 10px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }

    .control-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .btn-touch {
      width: 62px;
      height: 62px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1.5px solid var(--card-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: transform 0.1s, background 0.1s;
    }

    .btn-touch:active, .btn-touch.active {
      transform: scale(0.90);
      background: rgba(59, 130, 246, 0.4);
      border-color: var(--accent-blue);
    }

    .btn-gas {
      background: rgba(16, 185, 129, 0.25);
      border-color: rgba(16, 185, 129, 0.5);
    }
    .btn-gas:active, .btn-gas.active {
      background: rgba(16, 185, 129, 0.6);
    }

    .btn-brake {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
    }
    .btn-brake:active, .btn-brake.active {
      background: rgba(239, 68, 68, 0.6);
    }

    /* NOTIFICATION TOAST */
    .toast {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-green);
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 16px;
      color: var(--accent-green);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 30;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

  <div class="game-container" id="app">
    <!-- TOP HUD -->
    <div class="hud-top">
      <div class="status-bar">
        <div class="courier-info">
          <span>🛵</span>
          <span>Кур'єр #1</span>
        </div>
        <div class="stats-group">
          <div class="stat-badge" style="color: var(--accent-green);">
            💵 <span id="moneyText">0 ₴</span>
          </div>
          <div class="stat-badge" style="color: var(--accent-yellow);">
            ⭐ <span id="ratingText">5.0</span>
          </div>
        </div>
      </div>

      <!-- MISSION CARD -->
      <div class="mission-card" id="missionCard">
        <div>
          <div class="mission-title" id="mStatus">Крок 1: Забери замовлення</div>
          <div class="mission-desc" id="mTarget">Піцерія "Puzata Hata"</div>
        </div>
        <div class="mission-reward">
          <div id="mReward">+180 ₴</div>
          <div style="font-size:10px; color:#94a3b8;" id="mDist">0 м</div>
        </div>
      </div>
    </div>

    <!-- CANVAS GAME ENGINE -->
    <canvas id="gameCanvas"></canvas>

    <!-- TOAST NOTIFICATION -->
    <div class="toast" id="toast">Замовлення забрано! 📦</div>

    <!-- CONTROLS -->
    <div class="controls-layer">
      <!-- ЛІВО: КЕРУВАННЯ НАПРЯМКОМ -->
      <div class="control-group">
        <div class="btn-touch" id="btnLeft">⬅️</div>
        <div class="btn-touch" id="btnRight">➡️</div>
      </div>

      <!-- ПРАВО: ГАЗ ТА ГАЛЬМО -->
      <div class="control-group">
        <div class="btn-touch btn-brake" id="btnBrake">🛑</div>
        <div class="btn-touch btn-gas" id="btnGas">⚡</div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = document.getElementById('app').clientWidth;
      canvas.height = document.getElementById('app').clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ==========================================
    // СТАН ГРИ ТА САТИСТИКА
    // ==========================================
    let money = 0;
    let rating = 5.0;

    // Скутер (Гравець)
    const player = {
      x: 1200,
      y: 1200,
      angle: 0,
      speed: 0,
      maxSpeed: 7,
      accel: 0.15,
      friction: 0.96,
      turnSpeed: 0.045,
      width: 24,
      height: 42
    };

    // Клавіші керування
    const keys = { left: false, right: false, gas: false, brake: false };

    // ==========================================
    // КАРТА ТА ГЕНЕРАЦІЯ МІСТА
    // ==========================================
    const WORLD_SIZE = 3000;
    const BLOCK_SIZE = 350;
    const ROAD_WIDTH = 120;

    const buildings = [];
    const obstacles = [];

    function generateCity() {
      for (let x = 200; x < WORLD_SIZE - 200; x += BLOCK_SIZE + ROAD_WIDTH) {
        for (let y = 200; y < WORLD_SIZE - 200; y += BLOCK_SIZE + ROAD_WIDTH) {
          // Квартал будинків
          buildings.push({
            x: x,
            y: y,
            w: BLOCK_SIZE,
            h: BLOCK_SIZE,
            color: '#334155',
            roofColor: '#1e293b'
          });

          // Припарковане авто або баки як перешкоди
          if (Math.random() > 0.4) {
            obstacles.push({
              x: x + BLOCK_SIZE + 20,
              y: y + Math.random() * BLOCK_SIZE,
              w: 30,
              h: 50,
              color: ['#ef4444', '#3b82f6', '#f59e0b', '#64748b'][Math.floor(Math.random() * 4)]
            });
          }
        }
      }
    }
    generateCity();

    // ==========================================
    // СИСТЕМА ЗАМОВЛЕНЬ (QUEST SYSTEM)
    // ==========================================
    const deliveryState = {
      phase: 'PICKUP', // 'PICKUP' або 'DELIVER'
      pickupPoint: { x: 800, y: 1400, radius: 45, name: 'Піцерія "Puzata Hata"' },
      dropoffPoint: { x: 2200, y: 800, radius: 45, name: 'вул. Шевченка, 45' },
      reward: 180
    };

    function spawnNextOrder() {
      // Нова випадкова точка на дорозі
      let randX = 300 + Math.floor(Math.random() * 5) * (BLOCK_SIZE + ROAD_WIDTH) - ROAD_WIDTH / 2;
      let randY = 300 + Math.floor(Math.random() * 5) * (BLOCK_SIZE + ROAD_WIDTH) - ROAD_WIDTH / 2;

      deliveryState.pickupPoint = {
        x: randX,
        y: randY,
        radius: 45,
        name: ['Суші Бар "Oishi"', 'Бургерна "Craft"', 'Кав\'ярня "Lviv Coffee"', 'Пекарня "Галицька"'][Math.floor(Math.random() * 4)]
      };

      let dropX = 300 + Math.floor(Math.random() * 5) * (BLOCK_SIZE + ROAD_WIDTH) - ROAD_WIDTH / 2;
      let dropY = 300 + Math.floor(Math.random() * 5) * (BLOCK_SIZE + ROAD_WIDTH) - ROAD_WIDTH / 2;

      deliveryState.dropoffPoint = {
        x: dropX,
        y: dropY,
        radius: 45,
        name: `вул. Франка, ${Math.floor(Math.random() * 90 + 1)}`
      };

      deliveryState.reward = Math.floor(120 + Math.random() * 150);
      deliveryState.phase = 'PICKUP';

      updateMissionUI();
    }

    function updateMissionUI() {
      const card = document.getElementById('missionCard');
      const mStatus = document.getElementById('mStatus');
      const mTarget = document.getElementById('mTarget');
      const mReward = document.getElementById('mReward');

      if (deliveryState.phase === 'PICKUP') {
        card.classList.remove('delivering');
        mStatus.innerText = 'Крок 1: Забери замовлення';
        mTarget.innerText = deliveryState.pickupPoint.name;
      } else {
        card.classList.add('delivering');
        mStatus.innerText = 'Крок 2: Доставити клієнту';
        mTarget.innerText = deliveryState.dropoffPoint.name;
      }
      mReward.innerText = `+${deliveryState.reward} ₴`;
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ==========================================
    // ЛОГІКА ОПРАЦЮВАННЯ ТА КАЗА
    // ==========================================
    function setupControls() {
      const bindBtn = (id, keyName) => {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };

        btn.addEventListener('touchstart', start);
        btn.addEventListener('touchend', end);
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };

      bindBtn('btnLeft', 'left');
      bindBtn('btnRight', 'right');
      bindBtn('btnGas', 'gas');
      bindBtn('btnBrake', 'brake');

      // Клавіатура для ПК
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = true;
        if (e.key === 'ArrowDown' || e.key === 's') keys.brake = true;
      });
      window.addEventListener('keyup', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = false;
        if (e.key === 'ArrowDown' || e.key === 's') keys.brake = false;
      });
    }
    setupControls();

    // ==========================================
    // ФІЗИКА ТА ОНОВЛЕННЯ СТАНУ
    // ==========================================
    function updatePhysics() {
      // Газ / Гальмо
      if (keys.gas) {
        player.speed = Math.min(player.speed + player.accel, player.maxSpeed);
      } else if (keys.brake) {
        player.speed = Math.max(player.speed - player.accel * 1.5, -player.maxSpeed * 0.4);
      } else {
        player.speed *= player.friction;
      }

      // Поворот керма (працює при русі)
      if (Math.abs(player.speed) > 0.1) {
        const dir = player.speed > 0 ? 1 : -1;
        if (keys.left) player.angle -= player.turnSpeed * dir;
        if (keys.right) player.angle += player.turnSpeed * dir;
      }

      // Нові координати
      let nextX = player.x + Math.sin(player.angle) * player.speed;
      let nextY = player.y - Math.cos(player.angle) * player.speed;

      // Зіткнення з будинками
      let collided = false;
      buildings.forEach(b => {
        if (nextX > b.x - 12 && nextX < b.x + b.w + 12 &&
            nextY > b.y - 12 && nextY < b.y + b.h + 12) {
          collided = true;
        }
      });

      // Перешкоди
      obstacles.forEach(o => {
        if (nextX > o.x - 10 && nextX < o.x + o.w + 10 &&
            nextY > o.y - 10 && nextY < o.y + o.h + 10) {
          collided = true;
        }
      });

      if (!collided) {
        player.x = nextX;
        player.y = nextY;
      } else {
        player.speed = -player.speed * 0.4; // Відскок при ударі
      }

      // Перевірка зон замовлення
      let activeTarget = deliveryState.phase === 'PICKUP' ? deliveryState.pickupPoint : deliveryState.dropoffPoint;
      let dist = Math.hypot(player.x - activeTarget.x, player.y - activeTarget.y);

      document.getElementById('mDist').innerText = `${Math.round(dist)} м`;

      if (dist < activeTarget.radius) {
        if (deliveryState.phase === 'PICKUP') {
          deliveryState.phase = 'DELIVER';
          showToast('Вантаж забрано! 📦 Їдь до клієнта');
          updateMissionUI();
        } else {
          money += deliveryState.reward;
          document.getElementById('moneyText').innerText = `${money} ₴`;
          showToast(`Доставка успішна! +${deliveryState.reward} ₴ 🎉`);
          spawnNextOrder();
        }
      }
    }

    // ==========================================
    // РЕНДЕР (МАЛЮВАННЯ ГРИ)
    // ==========================================
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      // Центруємо камеру на скутері
      ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

      // 1. Зелені газони (Фон)
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

      // 2. Дороги
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

      // 3. Будинки та тротуари
      buildings.forEach(b => {
        // Тротуар
        ctx.fillStyle = '#475569';
        ctx.fillRect(b.x - 15, b.y - 15, b.w + 30, b.h + 30);

        // Будинок
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Дах
        ctx.fillStyle = b.roofColor;
        ctx.fillRect(b.x + 10, b.y + 10, b.w - 20, b.h - 20);
      });

      // 4. Перешкоди (Авто)
      obstacles.forEach(o => {
        ctx.fillStyle = o.color;
        ctx.beginPath();
        ctx.roundRect(o.x, o.y, o.w, o.h, 6);
        ctx.fill();
      });

      // 5. Точки цілей (Ресторан / Клієнт)
      let target = deliveryState.phase === 'PICKUP' ? deliveryState.pickupPoint : deliveryState.dropoffPoint;
      let targetColor = deliveryState.phase === 'PICKUP' ? '#f59e0b' : '#10b981';

      ctx.strokeStyle = targetColor;
      ctx.fillStyle = targetColor + '33';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(target.x, target.y, target.radius + Math.sin(Date.now() / 200) * 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = targetColor;
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(deliveryState.phase === 'PICKUP' ? '📦' : '🏁', target.x, target.y + 7);

      // 6. Скутер (Гравець)
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);

      // Тінь скутера
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-player.width / 2 + 3, -player.height / 2 + 3, player.width, player.height);

      // Корпус скутера
      ctx.fillStyle = '#3b82f6'; // Синій корпус
      ctx.beginPath();
      ctx.roundRect(-player.width / 2, -player.height / 2, player.width, player.height, 8);
      ctx.fill();

      // Термосумка доставки на багажнику
      ctx.fillStyle = '#10b981'; // Зелена сумка
      ctx.fillRect(-player.width / 2 + 2, player.height / 2 - 14, player.width - 4, 12);

      // Фара
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(0, -player.height / 2, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // 7. Динамічна GPS-Стрілка вказівник
      let angleToTarget = Math.atan2(target.y - player.y, target.x - player.x);
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(angleToTarget);

      ctx.fillStyle = targetColor;
      ctx.beginPath();
      ctx.moveTo(55, 0);
      ctx.lineTo(40, -8);
      ctx.lineTo(40, 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    // ==========================================
    // ГОЛОВНИЙ ЦИКЛ ГРИ (GAME LOOP)
    // ==========================================
    function gameLoop() {
      updatePhysics();
      render();
      requestAnimationFrame(gameLoop);
    }

    // Запуск
    spawnNextOrder();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
