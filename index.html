<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Delivery Simulator - Варіант В</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .hud {
      width: 100%;
      padding: 10px 15px;
      background: #1e1e1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .hud-item {
      font-size: 14px;
      font-weight: bold;
    }
    .val {
      color: #2ecc71;
    }

    #gameCanvas {
      background: #2c3e50;
      display: block;
      margin: 0 auto;
      border-left: 4px solid #f1c40f;
      border-right: 4px solid #f1c40f;
      flex-grow: 1;
      width: 100%;
      max-width: 420px;
    }

    .steering-container {
      width: 100%;
      max-width: 420px;
      padding: 15px 20px;
      background: #1e1e1e;
      border-top: 2px solid #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .steering-track {
      width: 100%;
      height: 50px;
      background: #2a2a2a;
      border-radius: 25px;
      position: relative;
      border: 2px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .steering-knob {
      width: 60px;
      height: 42px;
      background: #e67e22;
      border-radius: 20px;
      position: absolute;
      left: calc(50% - 30px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }

    .steering-label {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="hud-item">💰 <span class="val" id="money">0 ₴</span></div>
    <div class="hud-item">⚡ <span id="speed">0</span> км/г</div>
    <div class="hud-item">📦 <span style="color:#e74c3c;" id="hp">100%</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="steering-container">
    <div class="steering-track" id="steeringTrack">
      <div class="steering-knob" id="steeringKnob">🛵</div>
    </div>
    <div class="steering-label">👈 Совай бігунок для керування 👉</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = Math.min(window.innerWidth, 420);
      canvas.height = window.innerHeight - 130;
    }
    resizeCanvas();

    let player = {
      x: canvas.width / 2 - 15,
      y: canvas.height - 80,
      width: 30,
      height: 50,
      speed: 0,
      maxSpeed: 8,
      steerVelocity: 0
    };

    let roadOffsetY = 0;
    let money = 0;
    let hp = 100;
    let obstacles = [];
    let spawnTimer = 0;
    let gameOver = false;

    function spawnObstacle() {
      const size = 30 + Math.random() * 15;
      const x = 15 + Math.random() * (canvas.width - size - 30);
      obstacles.push({
        x: x,
        y: -size,
        width: size,
        height: size,
        type: Math.random() > 0.4 ? 'pothole' : 'car'
      });
    }

    function checkCollision(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    function draw() {
      ctx.fillStyle = '#34495e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadOffsetY;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      obstacles.forEach(obs => {
        if (obs.type === 'pothole') {
          ctx.fillStyle = '#1a252f';
          ctx.beginPath();
          ctx.ellipse(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, obs.height/2, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#c0392b';
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        }
      });

      ctx.fillStyle = '#e67e22';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(player.x + 5, player.y + 30, 20, 15);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('📦 Вантаж знищено!', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '15px sans-serif';
        ctx.fillStyle = '#2ecc71';
        ctx.fillText('Торкнись екрана для рестарту', canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    let lastTime = performance.now();

    function update(now) {
      let dt = (now - lastTime) / 1000;
      if (!dt || dt > 0.1) dt = 0.016;
      lastTime = now;

      let timeFactor = dt * 60;

      if (gameOver) {
        draw();
        requestAnimationFrame(update);
        return;
      }

      if (player.speed < player.maxSpeed) {
        player.speed += 0.15 * timeFactor;
      }

      player.x += player.steerVelocity * timeFactor;
      player.x = Math.max(15, Math.min(canvas.width - player.width - 15, player.x));

      roadOffsetY += player.speed * timeFactor;

      if (player.speed > 0) {
        money += player.speed * 0.05 * timeFactor;
        spawnTimer += player.speed * timeFactor;
        if (spawnTimer > 150) {
          spawnObstacle();
          spawnTimer = 0;
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += player.speed * timeFactor;

        if (checkCollision(player, obs)) {
          hp -= obs.type === 'car' ? 25 : 15;
          obstacles.splice(i, 1);
          
          if (tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('error');
          }
          
          if (hp <= 0) {
            hp = 0;
            gameOver = true;
          }
          continue;
        }

        if (obs.y > canvas.height) {
          obstacles.splice(i, 1);
        }
      }

      document.getElementById('speed').innerText = Math.round(player.speed * 10);
      document.getElementById('money').innerText = Math.floor(money) + ' ₴';
      document.getElementById('hp').innerText = hp + '%';

      draw();
      requestAnimationFrame(update);
    }

    function restartGame() {
      hp = 100;
      money = 0;
      obstacles = [];
      player.x = canvas.width / 2 - 15;
      player.speed = 0;
      player.steerVelocity = 0;
      resetKnob();
      gameOver = false;
    }

    function triggerHaptic() {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    // Логіка слайдера
    const track = document.getElementById('steeringTrack');
    const knob = document.getElementById('steeringKnob');
    let isDragging = false;

    function handleSteer(clientX) {
      const rect = track.getBoundingClientRect();
      let offsetX = clientX - rect.left;
      offsetX = Math.max(30, Math.min(rect.width - 30, offsetX));

      knob.style.left = `${offsetX - 30}px`;

      let normalized = (offsetX - rect.width / 2) / (rect.width / 2 - 30);
      player.steerVelocity = normalized * 6;
    }

    function resetKnob() {
      const rect = track.getBoundingClientRect();
      knob.style.left = `calc(50% - 30px)`;
      player.steerVelocity = 0;
    }

    track.addEventListener('touchstart', (e) => {
      if (gameOver) { restartGame(); return; }
      isDragging = true;
      handleSteer(e.touches[0].clientX);
      triggerHaptic();
    });

    window.addEventListener('touchmove', (e) => {
      if (isDragging && !gameOver && e.touches.length > 0) {
        handleSteer(e.touches[0].clientX);
      }
    });

    window.addEventListener('touchend', () => {
      isDragging = false;
      resetKnob();
    });

    // Підтримка миші на ПК
    track.addEventListener('mousedown', (e) => {
      if (gameOver) { restartGame(); return; }
      isDragging = true;
      handleSteer(e.clientX);
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging && !gameOver) {
        handleSteer(e.clientX);
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        resetKnob();
      }
    });

    window.addEventListener('click', () => {
      if (gameOver) restartGame();
    });

    requestAnimationFrame(update);
  </script>
</body>
</html>
