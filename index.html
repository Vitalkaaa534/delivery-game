<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Delivery Simulator - City Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --ui-bg: rgba(22, 27, 34, 0.88);
      --ui-border: rgba(255, 255, 255, 0.12);
      --accent-green: #22c55e;
      --accent-blue: #2563eb;
      --accent-yellow: #eab308;
    }

    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background: #87ceeb;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* TOP HUD BAR */
    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      z-index: 20;
    }

    .profile-card {
      background: var(--ui-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ui-border);
      border-radius: 20px;
      padding: 4px 10px 4px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      background: #15803d;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 2px solid #22c55e;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
    }

    .profile-name {
      font-size: 10px;
      color: #9ca3af;
      font-weight: 600;
    }

    .profile-level {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .xp-bar {
      width: 60px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin-top: 2px;
      overflow: hidden;
    }

    .xp-fill {
      width: 55%;
      height: 100%;
      background: var(--accent-green);
    }

    .stat-pill {
      background: var(--ui-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ui-border);
      border-radius: 16px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 13px;
    }

    .btn-plus {
      width: 16px;
      height: 16px;
      background: var(--accent-green);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-left: 2px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      background: var(--ui-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ui-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* QUEST CARD */
    .quest-card {
      position: absolute;
      top: calc(env(safe-area-inset-top, 10px) + 52px);
      left: 10px;
      right: 10px;
      background: var(--ui-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ui-border);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .quest-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quest-box-icon {
      font-size: 26px;
    }

    .quest-title {
      font-size: 13px;
      font-weight: 800;
    }

    .quest-sub {
      font-size: 10px;
      color: #9ca3af;
    }

    .quest-reward {
      text-align: right;
    }

    .reward-val {
      color: var(--accent-green);
      font-weight: 800;
      font-size: 14px;
    }

    .reward-dist {
      font-size: 10px;
      color: #9ca3af;
    }

    /* SIDE BUTTONS */
    .side-menu {
      position: absolute;
      left: 10px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .side-btn {
      width: 42px;
      height: 42px;
      background: var(--ui-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ui-border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: #ef4444;
      color: white;
      font-size: 9px;
      font-weight: 800;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* BOTTOM CONTROLS & TIMER */
    .bottom-ui {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 15px);
      left: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .timer-card {
      background: var(--ui-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ui-border);
      border-radius: 20px;
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 180px;
    }

    .timer-label {
      font-size: 9px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timer-val {
      font-size: 18px;
      font-weight: 900;
      font-family: monospace;
      color: #fff;
    }

    .controls-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .steering-group {
      display: flex;
      gap: 12px;
    }

    .btn-ctrl {
      width: 58px;
      height: 58px;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }

    .btn-ctrl:active {
      transform: scale(0.92);
      background: rgba(37, 99, 235, 0.8);
    }

    /* GAME OVER OVERLAY */
    .game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .game-over-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .go-btn {
      margin-top: 15px;
      padding: 12px 28px;
      background: var(--accent-green);
      border: none;
      border-radius: 14px;
      color: white;
      font-weight: 800;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="game-container" id="app">
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="profile-card">
        <div class="avatar">🛵</div>
        <div class="profile-info">
          <div class="profile-name">Кур'єр новачок</div>
          <div class="profile-level">Рівень 3</div>
          <div class="xp-bar"><div class="xp-fill"></div></div>
        </div>
      </div>

      <div class="stat-pill">
        💵 <span id="money">12 560 ₴</span> <span class="btn-plus">+</span>
      </div>

      <div class="stat-pill">
        ⚡ <span>8/10</span> <span class="btn-plus">+</span>
      </div>

      <div class="icon-btn">☰</div>
    </div>

    <!-- QUEST CARD -->
    <div class="quest-card">
      <div class="quest-left">
        <div class="quest-box-icon">📦</div>
        <div>
          <div class="quest-title">Доставка №137</div>
          <div class="quest-sub">Забери замовлення і достав до клієнта</div>
        </div>
      </div>
      <div class="quest-reward">
        <div class="reward-val">250 ₴</div>
        <div class="reward-dist" id="distText">1.2 км</div>
      </div>
    </div>

    <!-- SIDE MENU -->
    <div class="side-menu">
      <div class="side-btn">💬 <div class="badge">2</div></div>
      <div class="side-btn">🏆</div>
      <div class="side-btn">⚙️</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- BOTTOM UI -->
    <div class="bottom-ui">
      <div class="timer-card">
        <div class="timer-label">Час доставки</div>
        <div class="timer-val" id="timer">08:45</div>
      </div>

      <!-- ЗМІНЕНА ПАНЕЛЬ КЕРУВАННЯ: СТРІЛКИ ЛІВОРУЧ, ГАЗ ПРАВОРУЧ -->
      <div class="controls-row">
        <div class="steering-group">
          <div class="btn-ctrl" id="btnLeft">⬅️</div>
          <div class="btn-ctrl" id="btnRight">➡️</div>
        </div>
        <div class="btn-ctrl" id="btnGas" style="width:68px; height:68px; background:var(--accent-green);">⬆️</div>
      </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div class="game-over-screen" id="gameOver">
      <h2 style="font-size:26px; margin-bottom:5px;">📦 Аварія!</h2>
      <p style="color:#9ca3af; margin-bottom:15px;">Вантаж пошкоджено під час доставки</p>
      <button class="go-btn" id="restartBtn">Спробувати знову</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = document.getElementById('app').clientWidth;
      canvas.height = document.getElementById('app').clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // 3D Перспектива & Камера
    let horizonY = 0;
    let bottomY = 0;
    const FOV = 160;
    const Z_FAR = 700;

    function updateCamera() {
      horizonY = canvas.height * 0.35;
      bottomY = canvas.height - 40;
    }

    function project(x, z) {
      let scale = FOV / (z + FOV);
      return {
        x: canvas.width / 2 + x * scale,
        y: horizonY + (bottomY - horizonY) * scale,
        scale: scale
      };
    }

    // Стан гри
    let player = { x: 0, targetX: 0, z: 25, speed: 0, maxSpeed: 4.5 };
    let distanceLeft = 1200;
    let isAccelerating = false;
    let roadScroll = 0;
    let gameOver = false;

    // Генерація міських будинків
    let buildings = [];
    for (let i = 0; i < 20; i++) {
      buildings.push({
        z: i * 40,
        side: i % 2 === 0 ? -1 : 1,
        height: 60 + Math.random() * 80,
        width: 70 + Math.random() * 30,
        color: ['#e2e8f0', '#cbd5e1', '#94a3b8', '#fdba74', '#fde047'][Math.floor(Math.random() * 5)]
      });
    }

    let obstacles = [];
    function spawnObstacle() {
      obstacles.push({
        x: (Math.random() - 0.5) * 160,
        z: Z_FAR,
        color: ['#ef4444', '#3b82f6', '#10b981', '#f59e0b'][Math.floor(Math.random() * 4)]
      });
    }

    function drawSky() {
      updateCamera();
      let grad = ctx.createLinearGradient(0, 0, 0, horizonY);
      grad.addColorStop(0, '#38bdf8');
      grad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, horizonY);

      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(canvas.width * 0.8, horizonY * 0.3, 22, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawEnvironment() {
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

      const ROAD_W = 190;
      const SEGMENTS = 30;
      const segZ = Z_FAR / SEGMENTS;

      for (let i = SEGMENTS - 1; i >= 0; i--) {
        let z1 = i * segZ;
        let z2 = (i + 1) * segZ;

        let p1 = project(0, z1);
        let p2 = project(0, z2);

        let w1 = ROAD_W * p1.scale;
        let w2 = ROAD_W * p2.scale;

        let sw1 = (ROAD_W + 40) * p1.scale;
        let sw2 = (ROAD_W + 40) * p2.scale;

        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.moveTo(p1.x - sw1, p1.y);
        ctx.lineTo(p1.x + sw1, p1.y);
        ctx.lineTo(p2.x + sw2, p2.y);
        ctx.lineTo(p2.x - sw2, p2.y);
        ctx.fill();

        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.moveTo(p1.x - w1, p1.y);
        ctx.lineTo(p1.x + w1, p1.y);
        ctx.lineTo(p2.x + w2, p2.y);
        ctx.lineTo(p2.x - w2, p2.y);
        ctx.fill();

        let gpsW1 = 18 * p1.scale;
        let gpsW2 = 18 * p2.scale;
        ctx.fillStyle = 'rgba(37, 99, 235, 0.85)';
        ctx.beginPath();
        ctx.moveTo(p1.x - gpsW1, p1.y);
        ctx.lineTo(p1.x + gpsW1, p1.y);
        ctx.lineTo(p2.x + gpsW2, p2.y);
        ctx.lineTo(p2.x - gpsW2, p2.y);
        ctx.fill();

        if (Math.floor((z1 + roadScroll * 4) / 40) % 2 === 0) {
          let dash1 = 4 * p1.scale;
          let dash2 = 4 * p2.scale;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(p1.x - dash1, p1.y);
          ctx.lineTo(p1.x + dash1, p1.y);
          ctx.lineTo(p2.x + dash2, p2.y);
          ctx.lineTo(p2.x - dash2, p2.y);
          ctx.fill();
        }
      }
    }

    function drawBuildings() {
      buildings.sort((a, b) => b.z - a.z);

      buildings.forEach(b => {
        let roadOffset = b.side * 140;
        let p = project(roadOffset, b.z);

        let bw = b.width * p.scale;
        let bh = b.height * p.scale;

        ctx.fillStyle = b.color;
        ctx.fillRect(p.x - bw / 2, p.y - bh, bw, bh);

        ctx.fillStyle = '#64748b';
        ctx.fillRect(p.x - bw / 2, p.y - bh - (8 * p.scale), bw, 8 * p.scale);

        ctx.fillStyle = '#fef08a';
        for (let wx = -bw/3; wx <= bw/3; wx += 14 * p.scale) {
          for (let wy = -bh + 10 * p.scale; wy < -10 * p.scale; wy += 18 * p.scale) {
            ctx.fillRect(p.x + wx, p.y + wy, 6 * p.scale, 8 * p.scale);
          }
        }
      });
    }

    function drawTargetPin() {
      let p = project(0, 500);
      let size = 30 * p.scale;

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(p.x, p.y - size * 2, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(p.x - size, p.y - size * 2);
      ctx.lineTo(p.x + size, p.y - size * 2);
      ctx.lineTo(p.x, p.y);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y - size * 2, size * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlayer() {
      let p = project(player.x, player.z);
      let s = p.scale * 1.2;

      ctx.save();
      ctx.translate(p.x, p.y);

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 20 * s, 8 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-6 * s, -14 * s, 12 * s, 16 * s);

      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.roundRect(-16 * s, -45 * s, 32 * s, 26 * s, 5 * s);
      ctx.fill();

      ctx.fillStyle = '#166534';
      ctx.beginPath();
      ctx.arc(0, -52 * s, 10 * s, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawObstacles() {
      obstacles.forEach(obs => {
        let p = project(obs.x, obs.z);
        let w = 60 * p.scale;
        let h = 45 * p.scale;

        ctx.fillStyle = obs.color;
        ctx.beginPath();
        ctx.roundRect(p.x - w/2, p.y - h, w, h, 4 * p.scale);
        ctx.fill();
      });
    }

    let spawnTimer = 0;

    function update() {
      if (gameOver) return;

      if (isAccelerating) {
        if (player.speed < player.maxSpeed) player.speed += 0.04;
      } else {
        if (player.speed > 0) player.speed -= 0.02;
        if (player.speed < 0) player.speed = 0;
      }

      player.x += (player.targetX - player.x) * 0.15;
      roadScroll += player.speed;

      buildings.forEach(b => {
        b.z -= player.speed * 1.8;
        if (b.z < 0) b.z = Z_FAR;
      });

      spawnTimer += player.speed;
      if (spawnTimer > 180) {
        spawnObstacle();
        spawnTimer = 0;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.z -= player.speed * 2.2;

        if (obs.z <= player.z + 10 && obs.z >= player.z - 10) {
          if (Math.abs(obs.x - player.x) < 30) {
            gameOver = true;
            document.getElementById('gameOver').classList.add('active');
          }
        }
        if (obs.z < 0) obstacles.splice(i, 1);
      }

      if (player.speed > 0 && distanceLeft > 0) {
        distanceLeft -= player.speed * 0.1;
        document.getElementById('distText').innerText = `${(distanceLeft / 1000).toFixed(1)} км`;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSky();
      drawEnvironment();
      drawBuildings();
      drawTargetPin();
      drawObstacles();
      drawPlayer();

      requestAnimationFrame(update);
    }

    // Поворот ліворуч/праворуч (ліва рука)
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); player.targetX = Math.max(-110, player.targetX - 40); });
    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); player.targetX = Math.min(110, player.targetX + 40); });
    
    // Газ (права рука)
    const gasBtn = document.getElementById('btnGas');
    gasBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isAccelerating = true; });
    gasBtn.addEventListener('touchend', (e) => { e.preventDefault(); isAccelerating = false; });
    gasBtn.addEventListener('mousedown', () => isAccelerating = true);
    gasBtn.addEventListener('mouseup', () => isAccelerating = false);

    document.getElementById('restartBtn').addEventListener('click', () => {
      gameOver = false;
      player.x = 0;
      player.targetX = 0;
      player.speed = 0;
      distanceLeft = 1200;
      obstacles = [];
      document.getElementById('gameOver').classList.remove('active');
      requestAnimationFrame(update);
    });

    requestAnimationFrame(update);
  </script>
</body>
</html>
