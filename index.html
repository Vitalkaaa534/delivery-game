<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Delivery Simulator 3D - City Grid</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #070a12;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.15);
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background: #0b0f19;
      overflow: hidden;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* TOP HUD */
    .hud-top {
      position: absolute;
      top: calc(env(safe-area-inset-top, 10px) + 6px);
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .courier-info {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .stats-group {
      display: flex;
      gap: 6px;
    }

    .stat-badge {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    /* MISSION CARD */
    .mission-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-left: 5px solid var(--accent-yellow);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: border-color 0.3s;
    }

    .mission-card.delivering {
      border-left-color: var(--accent-green);
    }

    .mission-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
    }

    .mission-desc {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 2px;
    }

    .mission-reward {
      text-align: right;
      font-weight: 800;
      color: var(--accent-green);
      font-size: 15px;
    }

    /* CONTROLS OVERLAY */
    .controls-layer {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 15px) + 14px);
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .steering-group {
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }

    /* СТИЛЬНІ КНОПКИ КЕРУВАННЯ */
    .btn-ctrl {
      width: 66px;
      height: 66px;
      background: radial-gradient(circle at 30% 30%, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.15);
      transition: transform 0.08s, border-color 0.08s, background 0.08s;
      cursor: pointer;
    }

    .btn-ctrl svg {
      width: 28px;
      height: 28px;
      fill: #e2e8f0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .btn-ctrl:active, .btn-ctrl.pressed {
      transform: scale(0.90);
      background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.6), rgba(29, 78, 216, 0.8));
      border-color: var(--accent-blue);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
    }

    .btn-gas-single {
      pointer-events: auto;
      width: 86px;
      height: 86px;
      background: radial-gradient(circle at 30% 30%, rgba(16, 185, 129, 0.35), rgba(4, 120, 87, 0.7));
      backdrop-filter: blur(16px);
      border: 2px solid var(--accent-green);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4), inset 0 2px 6px rgba(255,255,255,0.3);
      cursor: pointer;
      transition: transform 0.08s, background 0.08s, box-shadow 0.08s;
    }

    .btn-gas-single:active, .btn-gas-single.pressed {
      transform: scale(0.92);
      background: radial-gradient(circle at 30% 30%, rgba(16, 185, 129, 0.8), rgba(5, 150, 105, 0.95));
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.8);
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid var(--accent-green);
      padding: 14px 26px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 15px;
      color: var(--accent-green);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 30;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

  <div class="game-container" id="app">
    <!-- TOP HUD -->
    <div class="hud-top">
      <div class="status-bar">
        <div class="courier-info">
          <span>🛵</span>
          <span>Кур'єр #1</span>
        </div>
        <div class="stats-group">
          <div class="stat-badge" style="color: var(--accent-green);">
            💵 <span id="moneyText">0 ₴</span>
          </div>
          <div class="stat-badge" style="color: var(--accent-yellow);">
            ⭐ <span id="ratingText">5.0</span>
          </div>
        </div>
      </div>

      <!-- MISSION CARD -->
      <div class="mission-card" id="missionCard">
        <div>
          <div class="mission-title" id="mStatus">Крок 1: Забери замовлення</div>
          <div class="mission-desc" id="mTarget">Кав'ярня "Lviv Coffee"</div>
        </div>
        <div class="mission-reward">
          <div id="mReward">+280 ₴</div>
          <div style="font-size:11px; color:#94a3b8; font-weight:700;" id="mDist">1850 м</div>
        </div>
      </div>
    </div>

    <!-- CANVAS GAME ENGINE -->
    <canvas id="gameCanvas"></canvas>

    <!-- TOAST -->
    <div class="toast" id="toast">Замовлення забрано! 📦</div>

    <!-- CONTROLS OVERLAY -->
    <div class="controls-layer">
      <!-- ЛІВОРУЧ: КЕРУВАННЯ СТРІЛКАМИ -->
      <div class="steering-group">
        <div class="btn-ctrl" id="btnLeft">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </div>
        <div class="btn-ctrl" id="btnRight">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </div>
      </div>

      <!-- ПРАВОРУЧ: ЄДИНА КНОПКА ГАЗУ -->
      <div class="btn-gas-single" id="btnGas">
        <span style="font-size: 26px; line-height: 1;">⚡</span>
        <span style="font-size: 11px; font-weight: 900; letter-spacing: 0.5px; margin-top: 3px;">ГАЗ</span>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = document.getElementById('app').clientWidth;
      canvas.height = document.getElementById('app').clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ==========================================
    // СТАН ГРИ ТА ФІЗИКА
    // ==========================================
    let money = 0;
    let rating = 5.0;

    const player = {
      x: 0,           // Сміщення на дорозі (-140 до 140)
      worldZ: 0,      // Загальний пройдений шлях
      speed: 0,
      maxSpeed: 10,
      accel: 0.14,
      autoBrake: 0.25,
      turnSpeed: 3.6,
      angle: 0
    };

    const inputState = { left: false, right: false, gas: false };

    // ==========================================
    // СВІТ ГРИ: СВІТЛОФОРИ, КАРТА ТА ПЕРЕШКОДИ
    // ==========================================
    const BLOCK_SIZE = 600; // Відстань між перехрестями
    const Z_FAR = 900;

    // Автомобілі-перешкоди
    let trafficCars = [];
    for (let i = 0; i < 5; i++) {
      trafficCars.push({
        z: 300 + i * 400 + Math.random() * 200,
        x: (Math.random() > 0.5 ? 1 : -1) * (30 + Math.random() * 50),
        speed: 2 + Math.random() * 2,
        color: ['#ef4444', '#3b82f6', '#eab308', '#94a3b8', '#10b981'][Math.floor(Math.random() * 5)]
      });
    }

    // Дорожні конуси / перешкоди
    let obstacles = [];
    for (let i = 0; i < 8; i++) {
      obstacles.push({
        z: 250 + i * 350 + Math.random() * 150,
        x: (Math.random() - 0.5) * 160,
        type: Math.random() > 0.5 ? 'CONE' : 'OIL'
      });
    }

    // Світлофори (кожні 600 метрів на перехрестях)
    function getTrafficLightState(z) {
      let cycle = (z + Math.floor(Date.now() / 50)) % 600;
      return cycle > 320 ? 'RED' : 'GREEN';
    }

    // ЗАМОВЛЕННЯ (ЗБІЛЬШЕНА ВІДСТАНЬ)
    const deliveryState = {
      phase: 'PICKUP',
      targetZ: 1800,
      reward: 280,
      targetName: 'Кав\'ярня "Lviv Coffee"'
    };

    function spawnNextOrder() {
      // Суттєво більша відстань (1500 - 3200м)
      const dist = 1500 + Math.floor(Math.random() * 1700);
      deliveryState.targetZ = player.worldZ + dist;
      deliveryState.reward = Math.floor(220 + dist * 0.08);
      deliveryState.phase = 'PICKUP';
      deliveryState.targetName = [
        'Суші Бар "Oishi"', 'Бургерна "Craft"', 'Кав\'ярня "Lviv Coffee"', 
        'Піцерія "Puzata Hata"', 'Ресторан "Панська Гуральня"'
      ][Math.floor(Math.random() * 5)];
      updateMissionUI();
    }

    function updateMissionUI() {
      const card = document.getElementById('missionCard');
      const mStatus = document.getElementById('mStatus');
      const mTarget = document.getElementById('mTarget');
      const mReward = document.getElementById('mReward');

      if (deliveryState.phase === 'PICKUP') {
        card.classList.remove('delivering');
        mStatus.innerText = 'Крок 1: Забери замовлення';
        mTarget.innerText = deliveryState.targetName;
      } else {
        card.classList.add('delivering');
        mStatus.innerText = 'Крок 2: Доставити клієнту';
        mTarget.innerText = 'проспект Свободи, ' + Math.floor(Math.random() * 80 + 1);
      }
      mReward.innerText = `+${deliveryState.reward} ₴`;
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // ==========================================
    // НАДІЙНІ СЕНСОРНІ ПОДІЇ (POINTER EVENTS)
    // ==========================================
    function setupPointerControl(id, keyName) {
      const btn = document.getElementById(id);
      const handleDown = (e) => {
        e.preventDefault();
        try { btn.setPointerCapture(e.pointerId); } catch(err){}
        inputState[keyName] = true;
        btn.classList.add('pressed');
      };
      const handleUp = (e) => {
        e.preventDefault();
        inputState[keyName] = false;
        btn.classList.remove('pressed');
      };
      btn.addEventListener('pointerdown', handleDown);
      btn.addEventListener('pointerup', handleUp);
      btn.addEventListener('pointercancel', handleUp);
      btn.addEventListener('pointerleave', handleUp);
    }

    setupPointerControl('btnLeft', 'left');
    setupPointerControl('btnRight', 'right');
    setupPointerControl('btnGas', 'gas');

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') inputState.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') inputState.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') inputState.gas = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') inputState.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') inputState.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') inputState.gas = false;
    });

    // ==========================================
    // 3D ПРОЄКЦІЯ КАМЕРИ
    // ==========================================
    const FOV = 190;
    function project(x, z) {
      let scale = FOV / (z + FOV);
      let horizonY = canvas.height * 0.36;
      let bottomY = canvas.height - 40;

      return {
        x: canvas.width / 2 + (x - player.x) * scale,
        y: horizonY + (bottomY - horizonY) * scale,
        scale: scale
      };
    }

    // ==========================================
    // ЛОГІКА ТА ОНОВЛЕННЯ ГРИ
    // ==========================================
    function update() {
      // 1. Газ та автоматичне гальмування
      if (inputState.gas) {
        player.speed = Math.min(player.speed + player.accel, player.maxSpeed);
      } else {
        player.speed = Math.max(player.speed - player.autoBrake, 0);
      }

      // 2. Керування поворотами
      if (inputState.left) {
        player.x = Math.max(-150, player.x - player.turnSpeed);
        player.angle = Math.max(-0.18, player.angle - 0.03);
      } else if (inputState.right) {
        player.x = Math.min(150, player.x + player.turnSpeed);
        player.angle = Math.min(0.18, player.angle + 0.03);
      } else {
        player.angle *= 0.75;
      }

      // 3. Рух вперед
      player.worldZ += player.speed;

      // 4. Рух трафіку
      trafficCars.forEach(car => {
        car.z += car.speed;
        if (car.z < player.worldZ - 50) {
          car.z = player.worldZ + Z_FAR + Math.random() * 300;
          car.x = (Math.random() > 0.5 ? 1 : -1) * (30 + Math.random() * 60);
        }

        // Зіткнення з авто
        let relZ = car.z - player.worldZ;
        if (relZ > 0 && relZ < 25 && Math.abs(car.x - player.x) < 32) {
          player.speed = 1; // Різке гальмування при ударi
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
        }
      });

      // 5. Зіткнення з конусами / калюжами
      obstacles.forEach(obs => {
        if (obs.z < player.worldZ - 50) {
          obs.z = player.worldZ + Z_FAR + Math.random() * 200;
          obs.x = (Math.random() - 0.5) * 160;
        }
        let relZ = obs.z - player.worldZ;
        if (relZ > 0 && relZ < 20 && Math.abs(obs.x - player.x) < 24) {
          player.speed *= 0.6; // Втрата швидкості
          obs.z += Z_FAR;
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
      });

      // 6. Дистанція та виконання цілей
      let distRemaining = Math.max(0, Math.round(deliveryState.targetZ - player.worldZ));
      document.getElementById('mDist').innerText = `${distRemaining} м`;

      if (distRemaining <= 20) {
        if (deliveryState.phase === 'PICKUP') {
          deliveryState.phase = 'DELIVER';
          const nextDist = 1600 + Math.floor(Math.random() * 1600);
          deliveryState.targetZ = player.worldZ + nextDist;
          showToast('Замовлення забрано! 📦 Їдь до клієнта');
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          updateMissionUI();
        } else {
          money += deliveryState.reward;
          document.getElementById('moneyText').innerText = `${money} ₴`;
          showToast(`Доставку виконано! +${deliveryState.reward} ₴ 🎉`);
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          spawnNextOrder();
        }
      }
    }

    // ==========================================
    // 3D РЕНДЕРИНГ МІСТА ТА КУР'ЄРА
    // ==========================================
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let horizonY = canvas.height * 0.36;

      // 1. Небо та нічне місто
      let skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, '#030712');
      skyGrad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, horizonY);

      // 2. Трава / Тротуари збоку
      ctx.fillStyle = '#064e3b';
      ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

      // 3. ДОРОГА, ПЕРЕХРЕСТЯ ТА БУДИНКИ
      const ROAD_W = 210;
      const SEGMENTS = 35;
      const segZ = Z_FAR / SEGMENTS;

      for (let i = SEGMENTS - 1; i >= 0; i--) {
        let z1 = i * segZ;
        let z2 = (i + 1) * segZ;

        let absZ1 = player.worldZ + z1;
        let absZ2 = player.worldZ + z2;

        let p1 = project(0, z1);
        let p2 = project(0, z2);

        let w1 = ROAD_W * p1.scale;
        let w2 = ROAD_W * p2.scale;

        let isIntersection = (Math.floor(absZ1 / BLOCK_SIZE) !== Math.floor(absZ2 / BLOCK_SIZE));

        // Обочина / Тротуар
        let sw1 = (ROAD_W + 40) * p1.scale;
        let sw2 = (ROAD_W + 40) * p2.scale;
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(p1.x - sw1, p1.y); ctx.lineTo(p1.x + sw1, p1.y);
        ctx.lineTo(p2.x + sw2, p2.y); ctx.lineTo(p2.x - sw2, p2.y);
        ctx.fill();

        // Полотно дороги або перехрестя
        ctx.fillStyle = isIntersection ? '#1e293b' : '#0f172a';
        ctx.beginPath();
        ctx.moveTo(p1.x - w1, p1.y); ctx.lineTo(p1.x + w1, p1.y);
        ctx.lineTo(p2.x + w2, p2.y); ctx.lineTo(p2.x - w2, p2.y);
        ctx.fill();

        // Дорожня розмітка або Зебра на перехресті
        if (isIntersection) {
          // Пішохідний перехід (Зебра)
          ctx.fillStyle = '#ffffff';
          for (let zx = -w1 + 10; zx < w1 - 10; zx += 25 * p1.scale) {
            ctx.fillRect(p1.x + zx, p1.y - 4 * p1.scale, 14 * p1.scale, 8 * p1.scale);
          }
        } else {
          // Центральна подвійна суцільна / переривчаста
          if (Math.floor(absZ1 / 35) % 2 === 0) {
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(p1.x - 2 * p1.scale, p1.y, 4 * p1.scale, (p2.y - p1.y));
          }
        }
      }

      // 4. ОБ'ЄМНІ БУДИНКИ З БОКІВ
      for (let bZ = 0; bZ < Z_FAR; bZ += 120) {
        let absZ = Math.floor((player.worldZ + bZ) / 120) * 120;
        let relZ = absZ - player.worldZ;
        if (relZ < 10) continue;

        // Перевіряємо чи це не перехрестя
        if (absZ % BLOCK_SIZE < 140) continue; 

        let p = project(0, relZ);
        let bScale = p.scale;

        // Лівий і правий будинки
        [-1, 1].forEach(side => {
          let bx = p.x + side * (ROAD_W + 90) * bScale;
          let bw = 110 * bScale;
          let bh = 140 * bScale;

          // Фасад
          ctx.fillStyle = side === -1 ? '#1e293b' : '#334155';
          ctx.fillRect(bx - bw / 2, p.y - bh, bw, bh);

          // Контур та вікна
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1;
          ctx.strokeRect(bx - bw / 2, p.y - bh, bw, bh);

          ctx.fillStyle = (absZ / 120) % 3 === 0 ? '#fef08a' : '#38bdf8';
          for (let wx = -bw / 3; wx <= bw / 3; wx += 16 * bScale) {
            for (let wy = -bh + 15 * bScale; wy < -15 * bScale; wy += 22 * bScale) {
              if (Math.random() > 0.3) {
                ctx.fillRect(bx + wx - 3 * bScale, p.y + wy, 7 * bScale, 11 * bScale);
              }
            }
          }
        });
      }

      // 5. СВІТЛОФОРИ НА ПЕРЕХРЕСТЯХ
      for (let lightZ = 0; lightZ < Z_FAR; lightZ += BLOCK_SIZE) {
        let absZ = Math.floor((player.worldZ + lightZ) / BLOCK_SIZE) * BLOCK_SIZE;
        let relZ = absZ - player.worldZ;
        if (relZ > 20 && relZ < Z_FAR) {
          let lp = project(ROAD_W + 20, relZ);
          let lState = getTrafficLightState(absZ);

          // Стовп світлофора
          ctx.fillStyle = '#64748b';
          ctx.fillRect(lp.x - 2, lp.y - 45 * lp.scale, 4, 45 * lp.scale);

          // Коробка світлофора
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(lp.x - 6 * lp.scale, lp.y - 65 * lp.scale, 12 * lp.scale, 24 * lp.scale);

          // Лампа
          ctx.fillStyle = lState === 'RED' ? '#ef4444' : '#10b981';
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(lp.x, lp.y - (lState === 'RED' ? 58 : 48) * lp.scale, 4 * lp.scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      // 6. ПЕРЕШКОДИ (КОНУСИ / КАЛЮЖІ / АВТОМОБІЛІ)
      obstacles.forEach(obs => {
        let relZ = obs.z - player.worldZ;
        if (relZ > 5 && relZ < Z_FAR) {
          let op = project(obs.x, relZ);
          if (obs.type === 'CONE') {
            // Дорожній конус
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(op.x, op.y - 18 * op.scale);
            ctx.lineTo(op.x - 8 * op.scale, op.y);
            ctx.lineTo(op.x + 8 * op.scale, op.y);
            ctx.fill();
          } else {
            // Калюжа / Олія
            ctx.fillStyle = '#0284c788';
            ctx.beginPath();
            ctx.ellipse(op.x, op.y, 16 * op.scale, 6 * op.scale, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });

      // Машини в трафіку
      trafficCars.forEach(car => {
        let relZ = car.z - player.worldZ;
        if (relZ > 5 && relZ < Z_FAR) {
          let cp = project(car.x, relZ);
          let cw = 36 * cp.scale;
          let ch = 22 * cp.scale;

          // Корпус машини ззаду
          ctx.fillStyle = car.color;
          ctx.beginPath();
          ctx.roundRect(cp.x - cw / 2, cp.y - ch, cw, ch, 4 * cp.scale);
          ctx.fill();

          // Дах / Скло
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(cp.x - cw / 3, cp.y - ch + 2 * cp.scale, cw / 1.5, ch / 2);

          // Задні червоні габарити
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(cp.x - cw / 2 + 2, cp.y - 6 * cp.scale, 6 * cp.scale, 4 * cp.scale);
          ctx.fillRect(cp.x + cw / 2 - 8 * cp.scale, cp.y - 6 * cp.scale, 6 * cp.scale, 4 * cp.scale);
        }
      });

      // 7. МАРКЕР ЦІЛІ (ЗАМОВЛЕННЯ / КЛІЄНТ)
      let targetRelZ = deliveryState.targetZ - player.worldZ;
      if (targetRelZ > 0 && targetRelZ < Z_FAR) {
        let tp = project(0, targetRelZ);
        let size = 45 * tp.scale;

        let color = deliveryState.phase === 'PICKUP' ? '#f59e0b' : '#10b981';
        ctx.strokeStyle = color;
        ctx.fillStyle = color + '33';
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.ellipse(tp.x, tp.y, size * 2.2, size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.font = `bold ${Math.max(12, Math.floor(20 * tp.scale))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(deliveryState.phase === 'PICKUP' ? '📦 ЗАМОВЛЕННЯ' : '🏁 КЛІЄНТ', tp.x, tp.y - size * 1.4);
      }

      // 8. ДЕТАЛІЗОВАНИЙ КУР'ЄР (ВИД ЗЗАДУ)
      let cx = canvas.width / 2;
      let cy = canvas.height - 65;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(player.angle);

      // Тінь під скутером
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.ellipse(0, 30, 26, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Заднє колесо з протектором
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-5, 12, 10, 20);

      // Заднє крило та глушник
      ctx.fillStyle = '#334155';
      ctx.fillRect(7, 10, 5, 14); // Вихлопна труба
      ctx.fillRect(-9, 14, 18, 6);

      // Корпус скутера (Пластік)
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.roundRect(-20, -12, 40, 28, 8);
      ctx.fill();

      // Стоп-сигнал (Палає яскраво при відпусканні газу)
      let isBraking = !inputState.gas && player.speed > 0;
      ctx.fillStyle = isBraking ? '#ff0000' : '#b91c1c';
      ctx.shadowColor = isBraking ? '#ff0000' : 'transparent';
      ctx.shadowBlur = isBraking ? 18 : 0;
      ctx.fillRect(-11, 12, 22, 5);
      ctx.shadowBlur = 0;

      // Дзеркала заднього виду
      ctx.fillStyle = '#64748b';
      ctx.fillRect(-26, -32, 6, 4);
      ctx.fillRect(20, -32, 6, 4);

      // Руки кур'єра на кермі
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-24, -30, 8, 12);
      ctx.fillRect(16, -30, 8, 12);

      // ТЕРМОСУМКА (ЯСКРАВА, З СВІТЛОВІДБИТВАЧАМИ ТА ЛОГО)
      ctx.fillStyle = '#10b981'; // Термосумка зеленого кольору
      ctx.beginPath();
      ctx.roundRect(-17, -48, 34, 28, 5);
      ctx.fill();

      // Світловідбивні смуги на сумці
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(-15, -44, 30, 3);
      ctx.fillRect(-15, -26, 30, 3);

      // Логотип сумки
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('EXPRESS', 0, -32);

      // Шолом кур'єра з візором
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, -54, 11, 0, Math.PI * 2);
      ctx.fill();

      // Темна смужка візора шолома
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-8, -58, 16, 4);

      ctx.restore();
    }

    // ==========================================
    // ГОЛОВНИЙ ЦИКЛ ГРИ
    // ==========================================
    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    spawnNextOrder();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
